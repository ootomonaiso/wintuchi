[package]
name = "envmon-overlay"
version = "0.1.0"
edition = "2021"
description = "PoC: taskbar-embedded CPU/MEM widget (Phase1 of PLAN-headless-rust-overlay)"

[dependencies]
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
